<style>
:root{--bg:#000;--card:#e9ebef;--card2:#f6f7f9;--ink:#0b0c10;--mut:#6b7080;--line:rgba(11,12,16,.09);--acc:#f99c00;--glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.14);--bub:#1d1e23;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--r:38px;--onink:#fff;--onacc:#000;--glow:rgba(249,156,0,.26)}

html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}

.stories{display:flex;gap:12px;padding:12px 18px 14px;overflow-x:auto;scrollbar-width:none;flex:none}.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;width:62px;flex:none;font-size:11px;color:#b9bcc6}
.st .ring{width:62px;height:62px;border-radius:50%;padding:3px;display:grid;place-items:center;border:2px solid transparent;position:relative}
.st .ring.on{border-color:var(--acc)}.st .ring.add{border:2px dashed #5b5e69;color:#d6d8df}
.st .ub{position:absolute;right:-1px;top:-1px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--onacc);font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #000}
.st span{max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* avatars */
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;background:#444;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
/* big light cards */
.cards{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 12px}
.card{background:var(--card);color:var(--ink);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.card.big{flex:1}.card.mini{flex:none}
.ch{display:flex;align-items:center;gap:8px;padding:20px 22px 8px}.ch h2{margin:0;font-size:22px;letter-spacing:-.02em;flex:1}.ch small{color:var(--mut);font-weight:600}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:4px 10px 14px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}

.row:active{background:rgba(128,128,128,.14)}
.row .tx{flex:1;min-width:0}.row b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.un small{color:var(--ink);font-weight:600}
.row .mt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--mut)}
.bd{min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--onink);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.mini .hs{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 16px;scrollbar-width:none}.mini .hs::-webkit-scrollbar{display:none}

.tile{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:22px;padding:9px 14px 9px 9px;flex:none;max-width:230px}
.tile b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile small{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mut);text-align:center;padding:26px 24px;font-size:14.5px;line-height:1.45}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* floating nav pill */
.nav{flex:none;display:flex;justify-content:center;padding:10px 0 calc(var(--sb) + 10px)}
.nav>div{display:flex;gap:4px;padding:6px;border-radius:34px;background:rgba(30,31,36,.92);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px)}
.nav button{width:56px;height:46px;border-radius:26px;display:grid;place-items:center;color:#a7aab5;position:relative}
.nav button.on{background:#fff;color:#000}

/* segmented control (friends) */
.seg{display:flex;gap:4px;padding:5px;margin:8px 18px 14px;border-radius:30px;background:var(--glass);flex:none}
.seg button{flex:1;height:42px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14px;color:#b9bcc6}
.seg button.on{background:#fff;color:#000}.seg .bd{background:var(--acc);color:var(--onacc);height:18px;min-width:18px;font-size:11px}
.pg{flex:1;min-height:0;display:flex;flex-direction:column}
.big-t{font-size:30px;font-weight:800;letter-spacing:-.03em;padding:calc(var(--st) + 18px) 22px 4px}
.field{display:flex;gap:8px;padding:6px 14px 10px}
.in{flex:1;min-width:0;height:48px;border-radius:24px;background:var(--card2);border:1px solid var(--line);padding:0 18px;color:var(--ink);outline:0}
.in::placeholder{color:#9a9eab}
.btn{height:48px;padding:0 22px;border-radius:24px;background:var(--ink);color:var(--onink);font-weight:700;flex:none}
.btn.acc{background:var(--acc);color:var(--onacc)}.btn.sm{height:36px;padding:0 15px;font-size:13.5px;border-radius:18px}.btn.gh{background:rgba(128,128,128,.18);color:var(--ink)}
.note{color:#c4432e;font-size:13.5px;padding:2px 22px 6px}.hint{color:var(--mut);font-size:13px;padding:2px 22px 8px}
/* profile */
.pf{position:relative;flex:1;overflow-y:auto;padding:calc(var(--st) + 118px) 18px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;scrollbar-width:none}
.cv{position:absolute;top:0;left:0;right:0;height:calc(var(--st) + 190px);background:linear-gradient(150deg,rgba(255,255,255,.1),#111) center/cover;display:flex;justify-content:flex-end;align-items:flex-start;padding:calc(var(--st) + 12px) 14px}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000);pointer-events:none}.cv .ib{position:relative;z-index:2;background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.pf>*:not(.cv){position:relative;z-index:1}
.hd.ov{position:absolute;left:0;right:0;top:0;z-index:5}.hd.ov .ib{background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 16px}
.chip{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:20px;background:var(--glass);font-size:13.5px;font-weight:600}
.chip.on{background:#fff;color:#000}
.pill{width:100%;max-width:340px;height:54px;border-radius:27px;background:#fff;color:#000;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}
.pill.dk{background:var(--glass);color:#fff}.pill.rd{color:#ff7a66;background:rgba(255,90,70,.1)}
.pf .np{display:flex;gap:10px;align-items:center;background:var(--glass);padding:10px 16px 10px 10px;border-radius:22px;margin:4px 0 8px;text-align:left}
/* chat overlay */
.chat{position:absolute;inset:0;isolation:isolate;background:#000;display:flex;flex-direction:column;z-index:20;animation:up .22s ease-out}
.chat[hidden],#sheet[hidden]{display:none}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.chat .hd{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 14px 8px;flex:none}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--glass);border-radius:30px;padding:5px 16px 5px 5px;text-align:left}
.who b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{display:block;color:#a7aab5;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small.ty{color:var(--acc)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:3px;scrollbar-width:none}.msgs::-webkit-scrollbar{display:none}
.dv{align-self:center;font-size:12px;color:#8d909c;margin:12px 0 6px;padding:3px 12px;border-radius:12px;background:var(--glass)}
.dis{align-self:center;text-align:center;font-size:12.5px;color:#8d909c;max-width:270px;line-height:1.4;margin:6px 0 10px}
.m{max-width:80%;display:flex;flex-direction:column;gap:2px}.m.me{align-self:flex-end;align-items:flex-end}.m.th{align-self:flex-start}
.bb{padding:10px 15px;border-radius:21px;background:var(--bub);font-size:15.5px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.m.me .bb{background:var(--acc);color:var(--onacc)}
.m.me.g1 .bb{border-bottom-right-radius:7px}.m.me.g2 .bb{border-top-right-radius:7px;border-bottom-right-radius:7px}.m.me.g3 .bb{border-top-right-radius:7px}
.m.th.g1 .bb{border-bottom-left-radius:7px}.m.th.g2 .bb{border-top-left-radius:7px;border-bottom-left-radius:7px}.m.th.g3 .bb{border-top-left-radius:7px}
.bb.bad{outline:2px solid #ff6b57}
.bb.im{padding:4px}.bb.im img{display:block;max-width:240px;max-height:300px;border-radius:17px}
.rp{font-size:12.5px;opacity:.75;border-left:3px solid currentColor;padding:1px 8px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.sg{display:flex;gap:10px;align-items:center;min-width:180px}.sg i{width:44px;height:44px;border-radius:10px;background:#555 center/cover;flex:none}.sg b{display:block;font-size:14px}.sg small{opacity:.7;font-size:12.5px}
.rx{display:flex;gap:4px;margin-top:-8px;z-index:1}.rx span{background:#2b2c33;border:2px solid #000;border-radius:12px;padding:1px 7px;font-size:13px}
.mm{font-size:11px;color:#7f8290;display:flex;gap:5px;align-items:center;padding:0 4px}.mm .tk{width:15px;height:15px;stroke-width:2.2}.mm .tk.rd{stroke:var(--acc)}
.comp{flex:none;padding:8px 12px calc(var(--sb) + 12px)}
.rpb{display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:18px;padding:8px 14px;margin-bottom:8px;font-size:13px;color:#c8cad3}.rpb span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,.12);border-radius:28px;padding:6px 6px 6px 8px;backdrop-filter:blur(14px)}
.cb textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:120px;min-height:36px;padding:8px 6px;font-size:16px;line-height:1.3;color:#fff}.cb textarea::placeholder{color:#a3a6b2}
.cb .ib{background:none;width:40px;height:40px}.sendb{width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none}.sendb[disabled]{opacity:.35}
/* sheet + toast + pill */
#sheet{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sh{width:100%;background:#16171b;border-radius:30px 30px 0 0;padding:14px 14px calc(var(--sb) + 14px);animation:up .18s ease-out}
.sh .rxs{display:flex;justify-content:space-around;padding:6px 0 12px}.sh .rxs button{font-size:28px;width:50px;height:50px;border-radius:25px;background:var(--glass)}.sh .rxs button.on{background:#fff}
.sh .it{display:flex;gap:14px;align-items:center;width:100%;padding:14px 16px;border-radius:18px;font-weight:600;font-size:16px;text-align:left}.sh .it:active{background:var(--glass)}.sh .it.rd{color:#ff7a66}
.toast{position:absolute;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:22px;font-weight:600;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center}.toast.on{opacity:1}
.inpill{position:absolute;left:12px;right:12px;top:calc(var(--st) + 8px);z-index:50;background:rgba(32,33,38,.96);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:10px 14px;display:flex;gap:12px;align-items:center;animation:dn .25s ease-out;backdrop-filter:blur(16px)}

@keyframes dn{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.full{position:absolute;inset:0;background:#000;z-index:70;display:grid;place-items:center}.full img{max-width:100%;max-height:100%}
/* auth */
.au{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 24px) 22px calc(var(--sb) + 24px)}
.au h1{font-size:46px;letter-spacing:-.04em;margin:0 0 6px;font-weight:800}.au h1 i{color:var(--acc);font-style:normal}
.au p{color:#a7aab5;margin:0 0 26px;line-height:1.45}
.au .in{width:100%;display:block;margin-bottom:10px;background:var(--glass);border:1px solid rgba(255,255,255,.1);color:#fff}
.au .in::placeholder{color:#8d909c}.au .pill{max-width:none;margin-top:8px}
.au .sw{text-align:center;color:#a7aab5;margin-top:16px;font-size:14.5px}.au .sw button{color:#fff;font-weight:700;text-decoration:underline}
.au .er{color:#ff8a78;font-size:14px;min-height:20px;margin:2px 4px 6px}
.load{flex:1;display:grid;place-items:center;color:#8d909c}

/* ---- search, hints, accessibility ---- */
.fbar{display:flex;gap:8px;padding:0 14px 6px;align-items:center}.fbar .in{background:var(--glass);border-color:transparent;color:#fff;height:42px}
.mm .vn{color:#c9a24a}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:12px}
.row:focus-visible{outline-color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- voice notes ---- */
.vc{display:flex;align-items:center;gap:10px;min-width:190px}.vp{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.18);display:grid;place-items:center;flex:none}.vp svg{fill:currentColor;stroke:none;width:18px;height:18px}
.m.th .vp{background:rgba(255,255,255,.14)}.vbar{flex:1;height:4px;border-radius:2px;background:rgba(128,128,128,.4);overflow:hidden}.vbar i{display:block;height:100%;width:0;background:currentColor;opacity:.8}.vc small{font-size:12px;opacity:.75;min-width:30px;text-align:right}
.recdot{flex:none;width:10px;height:10px;border-radius:50%;background:#ff4d3d;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}
#mic.rec{background:#ff4d3d;color:#fff}

/* ---- groups ---- */
.sn{font-size:12px;font-weight:700;color:var(--acc);margin:6px 10px 2px}
.gin{width:100%;display:block;background:var(--glass);border:0;color:#fff;margin-bottom:8px}.gin::placeholder{color:#8d909c}
.gpick{max-height:38vh;overflow:auto}.gp{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:16px;cursor:pointer}.gp:active{background:var(--glass)}.gp input{width:20px;height:20px;accent-color:var(--acc)}
.gml{max-height:40vh;overflow:auto}.sh .it small{font-weight:500}
.ch .btn.sm{height:32px;padding:0 13px}
</style>

document.addEventListener("click",e=>{if(lpf){lpf=0;e.stopPropagation();return}const b=e.target.closest("[data-lp]");if(b){const m=S.msgs.find(z=>String(z.id)===b.dataset.lp);if(m&&m.st==="fail")post(m)}
  if(e.target.id==="sheet")closeSheet()},true);
let lastTap={id:0,t:0};document.addEventListener("dblclick",e=>{const b=e.target.closest("[data-lp]");if(!b)return;S.act=b.dataset.lp;const m=S.msgs.find(z=>String(z.id)===S.act);if(m&&!m.tmp&&!(m.rx||{})[uid()])react("❤️")});
document.addEventListener("input",e=>{if(e.target.id==="fq"){S.fq=e.target.value.trim().toLowerCase();chatPaint();return}
  if(e.target.id==="t"){const t=e.target;t.style.height="auto";t.style.height=Math.min(120,t.scrollHeight)+"px";$("sb").disabled=!t.value.trim();
  if(RT.chat&&Date.now()-RT.ts>2500){RT.ts=Date.now();rtSend({topic:rtT(RT.chat),event:"broadcast",payload:{type:"broadcast",event:"typing",payload:{uid:uid()}}})}}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[role=button]")){e.preventDefault();e.target.click();return}
  if(e.target.id==="t"&&e.key==="Enter"&&!e.shiftKey&&!/Android|iPhone|iPad/i.test(navigator.userAgent)){e.preventDefault();document.querySelector('[data-a="send"]').click()}
  if(e.target.id==="q"&&e.key==="Enter"){e.preventDefault();document.querySelector('[data-a="find"]').click()}
  if((e.target.id==="pw"||e.target.id==="un"||e.target.id==="em")&&e.key==="Enter")doAuth();
  if(e.key==="Escape"){if(!$("sheet").hidden)closeSheet();else if(S.chat)closeChat()}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="pf"){const f=t.files[0];t.value="";if(!f)return;try{const d=await imgSmall(f,1024,.65);if(d.length>380000)return toast("That photo is too big");send("img",d)}catch(er){toast("Couldn't use that photo")}}
  if(t.id==="cvf"){const f=t.files[0];t.value="";if(!f)return;try{let d="";for(const q of[.6,.5,.4,.3]){d=await imgSmall(f,720,q,16/9);if(d.length<56000)break}if(d.length>=60000)return toast("That photo is too detailed");
      await api("/rest/v1/profiles?id=eq."+uid(),{m:"PATCH",h:{Prefer:"return=minimal"},b:{cover:d}});S.me.cover=d;paint();toast("Cover updated")}catch(er){toast(/cover/i.test(er.message||"")?"Run the newest supabase-setup.sql once (it adds covers).":"Couldn't use that photo")}}
  if(t.id==="avf"){const f=t.files[0];t.value="";if(!f)return;try{const d=await imgSmall(f,256,.75,1);const a={t:"img",u:d};await api("/rest/v1/profiles?id=eq."+uid(),{m:"PATCH",h:{Prefer:"return=minimal"},b:{av:a}});S.me.av=a;paint();toast("Photo updated")}catch(er){toast("Couldn't use that photo")}}});
/* ---- service worker + start ---- */
if("serviceWorker"in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{const d=e.data||{};if(d.type==="milo-open"){if(d.act==="chat"&&d.chat&&S.prof[d.chat])openChat(d.chat);else if(d.act==="friends"){S.tab="friends";S.seg="requests";paint()}}else if(d.type==="milo-resub"&&S.pu)pushOn(false)})}
/* ---- what's new (shown once after an update) ---- */
const VER=3,NEWS=["Group chats: tap + Group on Home","Voice notes: tap the mic to record, tap again to send","Cover photos on your profile","The app takes the colour of the song you're playing in milo.","Light, dark or auto cards (Profile → Cards)","Search a chat and see when messages are about to vanish","Send the song you're playing with the ♪ button"];
function whatsNew(){const p=LS.get("mc.ver",0);LS.set("mc.ver",VER);if(p&&p<VER)sheet(`<div style="padding:6px 8px 4px"><h3 style="margin:4px 0 10px;font-size:20px">What's new</h3>${NEWS.map(n=>`<div class="it" style="padding:8px 4px;font-weight:500">• ${esc(n)}</div>`).join("")}<button class="pill" data-a="closesheet" style="max-width:none;margin-top:10px">Got it</button></div>`)}
if(C)boot();else paint();
</script>
</body>
</html>
